<html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You Chuti Manikeee ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(-45deg, #ff758c, #ff7eb3, #a18cd1, #fbc2eb);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 45px 35px;
      width: min(90%, 500px);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      animation: cardIn 1.2s ease forwards;
    }

    .heart {
      font-size: 80px;
      display: inline-block;
      animation: heartbeat 1.2s infinite;
      filter: drop-shadow(0 0 15px rgba(255, 50, 100, 0.8));
    }

    h1 {
      margin-top: 15px;
      color: white;
      font-size: clamp(42px, 10vw, 75px);
      font-weight: 800;
      text-shadow: 0 0 10px #ff2f6d,
                   0 0 25px #ff2f6d,
                   0 0 50px #ff2f6d;
      animation: glow 2s ease-in-out infinite alternate;
    }

    p {
      margin-top: 15px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 18px;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 1s 1s ease forwards;
    }

    button {
      margin-top: 25px;
      padding: 14px 30px;
      border: none;
      border-radius: 50px;
      background: white;
      color: #ff477e;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: scale(0.95);
    }

    /* Floating hearts */
    .floating-heart {
      position: absolute;
      bottom: -50px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 25px;
      animation: floatUp linear infinite;
      pointer-events: none;
    }

    .floating-heart:nth-child(1) {
      left: 10%;
      animation-duration: 7s;
      animation-delay: 1s;
    }

    .floating-heart:nth-child(2) {
      left: 25%;
      animation-duration: 9s;
      animation-delay: 3s;
    }

    .floating-heart:nth-child(3) {
      left: 45%;
      animation-duration: 6s;
      animation-delay: 0s;
    }

    .floating-heart:nth-child(4) {
      left: 65%;
      animation-duration: 8s;
      animation-delay: 2s;
    }

    .floating-heart:nth-child(5) {
      left: 85%;
      animation-duration: 7s;
      animation-delay: 4s;
    }

    /* Surprise message */
    .message {
      margin-top: 20px;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      color: white;
      transition: all 0.8s ease;
    }

    .message.show {
      max-height: 200px;
      opacity: 1;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.25);
      }
      30% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.15);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #ff2f6d;
      }
      to {
        text-shadow:
          0 0 15px #ff2f6d,
          0 0 35px #ff2f6d,
          0 0 60px #ff2f6d;
      }
    }

    @keyframes gradient {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- Floating hearts -->
  <div class="floating-heart">❤️</div>
  <div class="floating-heart">💖</div>
  <div class="floating-heart">💕</div>
  <div class="floating-heart">💗</div>
  <div class="floating-heart">💘</div>

  <div class="container">

    <div class="heart">❤️</div>

    <h1>I Love You</h1>

    <p>
      You make my world brighter, my heart happier,
      and every moment more beautiful. ✨
    </p>

    <button onclick="showLove()">
      Click for a surprise 💌
    </button>

    <div class="message" id="message">
      <h2>You mean the world to me! 💕</h2>
      <p>
        No matter where life takes us,<br>
        you'll always have a special place in my heart. ❤️
      </p>
    </div>

  </div>

  <script>
    function showLove() {
      const message = document.getElementById("message");
      message.classList.toggle("show");

      // Create extra hearts when button is clicked
      for (let i = 0; i < 15; i++) {
        createHeart();
      }
    }

    function createHeart() {
      const heart = document.createElement("div");

      heart.innerHTML = ["❤️", "💖", "💕", "💗", "💘"][
        Math.floor(Math.random() * 5)
      ];

      heart.style.position = "fixed";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.bottom = "-30px";
      heart.style.fontSize = Math.random() * 20 + 20 + "px";
      heart.style.zIndex = "100";
      heart.style.pointerEvents = "none";

      const duration = Math.random() * 3 + 3;

      heart.style.animation = `
        floatUp ${duration}s linear forwards
      `;

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }
  </script>

</body>
</html>
